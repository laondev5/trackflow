# Runs the reminder job every 5 minutes (Vercel Hobby only allows daily crons).
# Setup: GitHub repo → Settings → Secrets and variables → Actions → add
#   APP_URL      e.g. https://your-app.vercel.app
#   CRON_SECRET  same value as in Vercel's environment variables
# Note: GitHub may delay scheduled runs by a few minutes under load.
# For minute-accurate reminders use cron-job.org instead (see README).
name: Task reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger reminder job
        run: |
          curl --fail-with-body -sS -X POST "${{ secrets.APP_URL }}/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 90
